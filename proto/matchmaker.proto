syntax = "proto3";

package matchmaker;

option go_package = "gen/matchmaker";

// The Service definition
service MatchmakerService {
  rpc FindMatch (FindMatchRequest) returns (FindMatchResponse);
  rpc ReportResult (ReportResultRequest) returns (ReportResultResponse);
}

// The Request: What the player sends
message FindMatchRequest {
  string player_id = 1;
  int32  mmr       = 2; // Matchmaking Rating (ELO)
  string region    = 3; // e.g., "EU-WEST", "US-EAST"
}

// The Response: What the server replies immediately
message FindMatchResponse {
  string ticket_id = 1; // "Ticket" to track their queue status
}

message ReportResultRequest {
  string match_id  = 1;
  string winner_id = 2; // The ID of the player who won
  string loser_id  = 3; // The ID of the player who lost
}

message ReportResultResponse {
  int32 winner_new_mmr = 1; // Return the updated skill rating
  int32 loser_new_mmr  = 2;
}
