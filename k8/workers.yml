# --- WORKER EU ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-eu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-eu
  template:
    metadata:
      labels:
        app: worker-eu
    spec:
      containers:
        - name: worker
          image: arena-matchmaker-matchmaker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_ADDR
              value: "redis:6379"
            - name: REGION
              value: "EU-WEST"
---
