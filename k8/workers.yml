    spec:
      containers:
        - name: worker
          image: arena-matchmaker-matchmaker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_ADDR
              value: "redis:6379"
            - name: REGION
              value: "US-EAST"
