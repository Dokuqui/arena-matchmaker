apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: LoadBalancer
  ports:
    - port: 50051
      targetPort: 50051
      name: grpc
    - port: 2112
      targetPort: 2112
      name: metrics
  selector:
    app: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # For local K8s (like Minikube), we set imagePullPolicy: Never
          image: arena-matchmaker-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
            - containerPort: 2112
          env:
            - name: REDIS_ADDR
              value: "redis:6379"
