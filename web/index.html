<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena God Mode</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.95);
            --border-color: #30363d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --accent-green: #238636;
            --accent-purple: #a371f7;
            --neon-glow: 0 0 10px rgba(88, 166, 255, 0.2);
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1f2428 0%, #0d1117 70%);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 40px;
            height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 40px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #58a6ff, #a371f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: var(--neon-glow);
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
            height: calc(100% - 100px);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }

        h2 {
            margin-top: 0;
            font-size: 1.1rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-dot {
            height: 10px;
            width: 10px;
            background-color: #f0883e;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #f0883e;
        }

        .status-dot.connected {
            background-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        .chart-container {
            flex-grow: 1;
            position: relative;
            min-height: 300px;
        }

       #log {
            flex-grow: 1;
            overflow-y: auto;
            min-height: 0;
            max-height: 400px;
            background: #050505;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #8b949e;
        }

        #log::-webkit-scrollbar {
            width: 8px;
        }

        #log::-webkit-scrollbar-track {
            background: #0d1117;
        }

        #log::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }

        #log::-webkit-scrollbar-thumb:hover {
            background: #58a6ff;
        }

        .log-entry {
            border-bottom: 1px solid #161b22;
            padding: 4px 0;
            animation: fadeIn 0.3s ease-in;
        }

        .log-entry:first-child {
            color: #e6edf3;
            font-weight: bold;
        }

        .ts {
            color: #58a6ff;
            margin-right: 10px;
        }

        .val-eu {
            color: var(--accent-green);
        }

        .val-us {
            color: var(--accent-purple);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <h1>⚡ ARENA OPS CENTER ⚡</h1>

    <div class="container">
        <div class="card">
            <h2>
                Global Queue Load
                <span id="connectionStatus" class="status-dot"></span>
            </h2>
            <div class="chart-container">
                <canvas id="queueChart"></canvas>
            </div>
        </div>

        <div class="card">
            <h2>Real-Time Event Stream</h2>
            <div id="log">
                <div class="log-entry">Waiting for data stream...</div>
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('queueChart').getContext('2d');

        const chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Active Regions'],
                datasets: [
                    {
                        label: 'EU-WEST',
                        data: [0],
                        backgroundColor: '#238636',
                        borderColor: '#2ea043',
                        borderWidth: 1,
                        borderRadius: 4,
                        barPercentage: 0.6
                    },
                    {
                        label: 'US-EAST',
                        data: [0],
                        backgroundColor: '#a371f7',
                        borderColor: '#bc8cff',
                        borderWidth: 1,
                        borderRadius: 4,
                        barPercentage: 0.6
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'top',
                        labels: { color: '#c9d1d9', font: { family: 'Inter', size: 12 } }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        suggestedMax: 20,
                        grid: { color: '#30363d' },
                        ticks: { color: '#8b949e', font: { family: 'JetBrains Mono' } }
                    },
                    x: {
                        display: false,
                        grid: { display: false }
                    }
                },
                animation: { duration: 0 }
            }
        });

        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = protocol + "//" + location.host + "/ws";
        const ws = new WebSocket(wsUrl);
        const statusDot = document.getElementById('connectionStatus');

        ws.onopen = function () {
            console.log("✅ WebSocket Connected!");
            statusDot.classList.add('connected');
        };

        ws.onclose = function () {
            statusDot.classList.remove('connected');
        };

        ws.onmessage = function (event) {
            const data = JSON.parse(event.data);

            chart.data.datasets[0].data = [data.eu_count];
            chart.data.datasets[1].data = [data.us_count];

            const maxVal = Math.max(data.eu_count, data.us_count);
            if (maxVal > chart.options.scales.y.suggestedMax) {
                chart.options.scales.y.suggestedMax = maxVal + 10;
            }

            chart.update();

            const log = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'log-entry';

            const time = new Date().toLocaleTimeString('en-US', { hour12: false });

            entry.innerHTML = `
                <span class="ts">[${time}]</span> 
                Queue Sync: 
                EU=<span class="val-eu">${data.eu_count}</span> 
                US=<span class="val-us">${data.us_count}</span>
            `;

            log.prepend(entry);

            if (log.children.length > 20) {
                log.lastElementChild.remove();
            }
        };
    </script>
</body>

</html>
